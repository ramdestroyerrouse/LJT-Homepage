name: Build Test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - name: Verify output
        run: |
          echo "=== Generated content ==="
          find _site -name "*.html" | sort | head -40
          echo "=== Key checks ==="
          grep -q "Junteng Liu" _site/index.html && echo "OK: name"
          grep -q "SynLogic" _site/index.html && echo "OK: publications in about"
          grep -q "SynLogic" _site/publications/index.html && echo "OK: publications page"
          grep -q "jliugi@connect.ust.hk" _site/index.html && echo "OK: email"
          echo "=== Done ==="
