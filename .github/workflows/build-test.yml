name: Build Test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - name: Verify output
        run: |
          echo "=== Generated pages ==="
          find _site -name "index.html" | sort
          echo "=== Home page checks ==="
          for t in "Junteng Liu" "HKUST NLP Group" "Research Interests" "LLM Reasoning and Reinforcement Learning" "Hallucination in Vision-Language Models" "LLM Truthfulness and Interpretability" "Academic Background" "Ph.D. in Computer Science" "B.Eng." "Zhiyuan Honor Scholarship" "Research Experience" "MINIMAX" "Tencent WXG" "Shanghai AI Lab" "Zifei Shan" "Prof. Yu Cheng" "Publications" "SynLogic" "On the Perception Bottleneck of VLMs for Chart Understanding" "On the Universal Truthfulness Hyperplane Inside LLMs" "In-Context Sharpness as Alerts" "C-Eval" "Composing Parameter-Efficient Modules with Arithmetic Operations" "Skills" "Natural Language Processing" "Machine Learning" "jliugi@connect.ust.hk" "Vicent0205" "Google Scholar" "junteng88716710"; do grep -q "$t" _site/index.html && echo "FOUND: $t" || echo "MISSING: $t"; done
          echo "=== Publications page checks ==="
          for t in "SynLogic" "Perception Bottleneck" "Universal Truthfulness" "In-Context Sharpness" "C-Eval" "Composing Parameter-Efficient"; do grep -q "$t" _site/publications/index.html && echo "FOUND: $t" || echo "MISSING: $t"; done
          echo "=== Fake template content check ==="
          grep -R -l "Paper Title Number\|GitHub University\|Jane Doe\|Your Name\|Academic Pages is a ready-to-fork" _site --include="*.html" || echo "No fake template content found"
