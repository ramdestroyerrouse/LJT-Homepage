name: Enable Pages

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Try to create Pages site with legacy branch build
        run: |
          echo "=== POST /repos/${{ github.repository }}/pages (legacy) ==="
          curl -s -w "\nHTTP %{http_code}\n" -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d '{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}' \
            https://api.github.com/repos/${{ github.repository }}/pages || true
          echo ""
          echo "=== GET /repos/${{ github.repository }}/pages ==="
          curl -s -w "\nHTTP %{http_code}\n" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages || true
