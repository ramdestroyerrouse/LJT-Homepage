# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole site, values
# which you are expected to set up once and rarely edit after that.

# Site settings
locale: "en-US"
title: "Junteng Liu"
title_separator: "-"
name: "Junteng Liu"
description: "Personal website of Junteng Liu, a first-year PhD candidate at the HKUST NLP Group."
url: "https://ramdestroyerrouse.github.io"
baseurl: "/LJT-Homepage"
repository: "ramdestroyerrouse/LJT-Homepage"

# Site Author
author:
  name: "Junteng Liu"
  avatar: "profile.png"
  bio: "First-year PhD candidate at the HKUST NLP Group."
  employer: "Hong Kong University of Science and Technology"
  email: "jliugi@connect.ust.hk"
  googlescholar: "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
  github: "Vicent0205"
  twitter: "junteng88716710"

# Site settings
teaser:
breadcrumbs: false
words_per_minute: 200
read_more: "disabled"
future: true
talkmap_link: false

# Social sharing
twitter:
  username: "junteng88716710"
og_image: "/images/og-image.png"
og_description: "Personal website of Junteng Liu, a first-year PhD candidate at the HKUST NLP Group."

# SEO / social
social:
  type: Person
  name: "Junteng Liu"
  links:
    - "https://github.com/Vicent0205"
    - "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
    - "https://twitter.com/junteng88716710"

# Site search
search: false

# Analytics
analytics:
  provider: false

# Comments
comments:
  provider: false

# Collections
collections:
  publications:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/
  teaching:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/

# Publication categories
publication_category:
  conferences:
    title: "Conference Papers"
  manuscripts:
    title: "Preprints"

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true

# Plugins
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# Outputting
permalink: /:categories/:title/
timezone:

# Include _pages
include:
  - _pages

# Exclude from processing
exclude:
  - .devcontainer
  - .github
  - AGENTS.md
  - Dockerfile
  - docker-compose.yaml
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - markdown_generator
  - node_modules
  - package.json
  - scripts
  - talkmap
  - talkmap.ipynb
  - talkmap.py
  - talkmap_out.ipynb
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

# HTML compression
compress_html:
  clippings: all
  ignore:
    envs: development
